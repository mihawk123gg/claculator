<!DOCTYPE html>
<html>
<head>
    <title>3D Calculator</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #e6e6e6;
            font-family: Arial;
        }

        .calculator {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 15px;
            width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #display {
            width: 100%;
            height: 55px;
            font-size: 24px;
            text-align: right;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
        }

        .container {
            display: flex;
            justify-content: space-between;
        }

        .numbers {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            gap: 8px;
        }

        .ops {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            width: 55px;
            height: 55px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;

            /* 3D effect */
            box-shadow: 0 4px #999;
            transition: 0.1s;
        }

        button:active {
            box-shadow: 0 2px #666;
            transform: translateY(2px);
        }

        .num {
            background: #ffffff;
        }

        .op {
            background: orange;
            color: white;
        }

        .eq {
            background: green;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .clear {
            background: red;
            color: white;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" disabled>

    <div class="container">

        <!-- Numbers -->
        <div class="numbers">
            <button class="num" onclick="press('7')">7</button>
            <button class="num" onclick="press('8')">8</button>
            <button class="num" onclick="press('9')">9</button>

            <button class="num" onclick="press('4')">4</button>
            <button class="num" onclick="press('5')">5</button>
            <button class="num" onclick="press('6')">6</button>

            <button class="num" onclick="press('1')">1</button>
            <button class="num" onclick="press('2')">2</button>
            <button class="num" onclick="press('3')">3</button>

            <button class="num" onclick="press('0')">0</button>
            <button class="num" onclick="press('.')">.</button>
            <button class="eq" onclick="calculate()">=</button>
        </div>

        <!-- Operators -->
        <div class="ops">
            <button class="op" onclick="press('+')">+</button>
            <button class="op" onclick="press('-')">-</button>
            <button class="op" onclick="press('*')">×</button>
            <button class="op" onclick="press('/')">÷</button>
            <button class="clear" onclick="clearDisplay()">C</button>
        </div>

    </div>
</div>

<script>
function press(val) {
    document.getElementById("display").value += val;
}

function calculate() {
    try {
        document.getElementById("display").value =
            eval(document.getElementById("display").value);
    } catch {
        document.getElementById("display").value = "Error";
    }
}

function clearDisplay() {
    document.getElementById("display").value = "";
}
</script>

</body>
</html>
