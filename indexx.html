<!DOCTYPE html>
<html>

<head>
    <title>3D Calculator</title>

    <style>

    body{
        margin:0;
        height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;

        background:#e6e6e6;

        font-family:Arial;
    }

    .calculator{

        background:#2b2b2b;

        padding:25px;

        border-radius:20px;

        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    #display{

        width:340px;
        height:70px;

        font-size:32px;

        text-align:right;

        background:#111;
        color:white;

        border:none;

        border-radius:15px;

        padding-right:15px;

        margin-bottom:20px;

        box-shadow:inset 0 0 10px black;
    }

    .calc-container{
        display:flex;
        gap:15px;
    }

    .numbers{

        display:grid;

        grid-template-columns:
        repeat(3,80px);

        gap:10px;
    }

    .operations{

        display:flex;
        flex-direction:column;

        gap:10px;
    }

    .calc-btn{

        width:80px;
        height:80px;

        font-size:28px;

        border:none;

        border-radius:15px;

        cursor:pointer;

        box-shadow:0 6px #777;

        transition:0.1s;
    }

    .calc-btn:active{

        transform:translateY(3px);

        box-shadow:0 3px #555;
    }

    .num{
        background:white;
    }

    .op{
        background:orange;
        color:white;
    }

    .equal{
        background:green;
        color:white;
    }

    .clear{
        background:red;
        color:white;
    }

    </style>

</head>

<body>

<div class="calculator">

    <input type="text" id="display" readonly>

    <div class="calc-container">

        <div class="numbers">

            <button class="calc-btn num" onclick="press('7')">7</button>
            <button class="calc-btn num" onclick="press('8')">8</button>
            <button class="calc-btn num" onclick="press('9')">9</button>

            <button class="calc-btn num" onclick="press('4')">4</button>
            <button class="calc-btn num" onclick="press('5')">5</button>
            <button class="calc-btn num" onclick="press('6')">6</button>

            <button class="calc-btn num" onclick="press('1')">1</button>
            <button class="calc-btn num" onclick="press('2')">2</button>
            <button class="calc-btn num" onclick="press('3')">3</button>

            <button class="calc-btn num" onclick="press('0')">0</button>
            <button class="calc-btn num" onclick="press('.')">.</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>

        </div>

        <div class="operations">

            <button class="calc-btn op" onclick="press('+')">+</button>

            <button class="calc-btn op" onclick="press('-')">−</button>

            <button class="calc-btn op" onclick="press('*')">×</button>

            <button class="calc-btn op" onclick="press('/')">÷</button>

            <button class="calc-btn clear" onclick="clearDisplay()">C</button>

        </div>

    </div>

</div>

<script>

function press(value){

    document.getElementById("display").value += value;
}

function clearDisplay(){

    document.getElementById("display").value = "";
}

function calculate(){

    try{

        document.getElementById("display").value =
        eval(document.getElementById("display").value);

    }

    catch{

        document.getElementById("display").value = "Error";
    }
}

</script>

</body>

</html>
